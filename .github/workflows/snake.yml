name: Generate Contribution Snake

on:
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate cyberpunk yellow snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FCEE0A&color_dots=%23161b22,%233d3300,%23756000,%23b89500,%23FCEE0A
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%23C49A00&color_dots=%23ebedf0,%23fff2b2,%23ffe066,%23facc15,%23b8860b

      - name: Publish generated SVGs
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
