  <text x="18" y="241">                  :@@@@@@@@%    @@@@@@@@@. @@@@@          +@@@@- #@@@@         @@@@+</text>
  <text x="18" y="257">                  -@@@@ @@@@@  @@@@%=@@@@ =@@@@:           @@@@% #@@@@@%@%@%@@@@@@@ :@@@@@@@@@@@@@@@@. %@@@@@@@@@@@@@@@-</text>
