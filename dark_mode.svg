  <text x="18" y="289">                  -@@@@   #@@@@@@=  +@@@@. @@@@@          *@@@@= #@@@@=-=-%@@@@=</text>
  <text x="18" y="305">                  :@@@@    +@@@@.   =@@@@.  @@@@@%      +@@@@@=  #@@@@     +@@@@#</text>
  <text x="18" y="321">                  -@@@@     :@@     +@@@@    *@@@@@@@@@@@@@@@    #@@@%      -@@@@@  :@@@@@@@@@@@@@@@@. %@@@@@@@@@@@@@@@-</text>
  <text x="18" y="337">                  -@@@@             =@@@@.      #@@@@@@@@%-      #@@@@        @@@@@-.@@@@@@@@@@@@@@@@: @@@@@@@@@@@@@@@@=</text>
</g>

<!-- INFO PANEL: aligned terminal columns -->
